<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Blanks Audit Report</title>
    
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background: linear-gradient(to right, #eef4f9, #d0e0ed); 
            background-attachment: fixed;
        }
        
        h1, .controles, table {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 10px;
        }
        h1 { 
            text-align: center; 
            color: #003366; 
            margin-bottom: 20px;
            font-size: 2em;
        }
        .controles { 
            margin-bottom: 20px; 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            align-items: flex-end;
            gap: 15px; 
        }
        .control-group {
            display: flex;
            flex-direction: column; 
            align-items: flex-start;
            padding: 10px;
            border: 1px solid #ccc; 
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .control-group label {
            font-weight: bold;
            color: #003366;
            margin-bottom: 5px;
        }
        select, .btn { 
            padding: 8px 12px; 
            border-radius: 5px; 
            border: 1px solid #003366; 
            font-weight: bold; 
        }
        .btn { 
            background: #0066cc; 
            color: white; 
            cursor: pointer; 
        }
        .btn:hover { background: #004c99; }
        .btn-pdf { background: #cc0000; border-color: #990000; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        table, th, td { border: 1px solid #666; }
        th, td { padding: 8px; text-align: center; vertical-align: middle; }
        th { background: #003366; color: white; font-size: 0.85em; }
        
        input[type="number"], input[type="text"], select, textarea { 
            width: 95%; 
            padding: 5px; 
            border-radius: 5px; 
            border: 1px solid #ccc; 
            box-sizing: border-box; 
        }
        .ar-acepta { background-color: #c8f7c5; font-weight: bold; color: #006400; text-align: center; }
        .ar-rechaza { background-color: #f7c5c5; font-weight: bold; color: #8b0000; text-align: center; }
        
        .small-btn { padding: 4px 8px; font-size: 12px; margin-top:6px; }
        .defect-row { margin-top:6px; display:flex; gap:3px; justify-content:center; }
    </style>
</head>
<body>

<h1>Blanks Audit Report</h1>

<div class="controles">
    <div class="control-group">
        <label for="auditor">Auditor:</label>
        <select id="auditor">
            <option value="">-- Select Auditor --</option>
            <option value="Guillermo Ortega">Guillermo Ortega</option>
            <option value="Griselda Garcia">Griselda Garcia</option>
            <option value="Jacquelinne Zepeda">Jacquelinne Zepeda</option>
        </select>
    </div>

    <div class="control-group">
        <label for="product-type">Product Type:</label>
        <select id="product-type" onchange="manejarCambioDeProducto()">
            <option value="CAPS">🧢 Caps</option>
            <option value="GARMENTS">👕 Garments</option>
        </select>
    </div>
    
    <div class="control-group">
        <label for="vendor">Vendor:</label>
        <select id="vendor">
            <option value="">-- Select Vendor --</option>
        </select>
    </div>
    
    <div style="display: flex; gap: 8px;">
        <button class="btn" onclick="agregarFila()">➕ Add Item</button>
        <button class="btn" id="descargarSoloExcel">⬇️ Excel</button>
        <button class="btn btn-pdf" id="descargarPDF">PDF</button>
    </div>
</div>

<table id="tabla">
    <thead>
        <tr>
            <th>Invoice</th>
            <th>PO</th>
            <th>Style</th>
            <th>Color</th>
            <th>Total Qty</th>
            <th>Sample</th>
            <th>Defects (Code / Qty)</th> 
            <th>Tot Defects</th>
            <th>AQL %</th>
            <th>A/R</th>
            <th>Comments</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td><input type="text" name="factura[]"></td>
            <td><input type="text" name="po[]"></td>
            <td><input type="text" name="estilo[]"></td>
            <td><input type="text" name="color[]"></td>
            <td><input type="number" name="total[]" min="0" oninput="calcularFila(this.closest('tr'))"></td>
            <td><input type="text" name="muestra[]" readonly></td>
            <td>
                <div class="defectos">
                    <div class="defect-row">
                        <select class="codigo-defecto"></select>
                        <input type="number" placeholder="Qty." class="cantidad-defecto" min="0" oninput="calcularFila(this.closest('tr'))">
                        <button type="button" class="btn small-btn" onclick="quitarDefecto(this)">−</button>
                    </div>
                </div>
                <button type="button" class="btn small-btn" onclick="agregarDefecto(this)">➕ Defect</button>
            </td>
            <td><input type="text" name="totalDefectos[]" readonly></td>
            <td><input type="text" name="aql[]" readonly></td>
            <td><input type="text" name="ar[]" readonly></td>
            <td><textarea name="comentarios[]"></textarea></td>
        </tr>
    </tbody>
</table>

<script>
const PROVEEDORES = {
    CAPS: ["Asia Caps (Thailand) Co., Ltd.", "Asia Caps Co., Ltd.", "ERA Fashion Accesory Co.", "GOTOP TEXTILE COMPANY LIMITED", "Giant Headmost Manufacturing Corp", "HENAN J&F HEADWEAR CO., LTD", "Jeya Headwear", "Ratone International LTD. Loc", "Shiningcrown Hats Mfg., Corp.", "Unimas Sportswear Ltd.", "Ouray Sportswear"],
    GARMENTS: ["New Trend Vietnam Co. Ltd.", "Global Knitwear Limited", "New Wave Apparel", "Green Valley Manufacturing", "Solis Textiles", "Al-Ameera (Pvt) Ltd.", "E.W. YEN JOINT STOCK COMPANY", "FRUIT OF THE LOOM", "M/S.J-WIN FASHIONS", "Marva Exports", "Metrotex Industries", "Milestone Textiles", "Ningbo Wollomtex Apparel Co. Ltd.", "Ouray Sportswear", "Kay & Emms Pvt ltd", "NG TEXTILES GUATEMALA S.A."]
};

const DEFECTOS_POR_TIPO = {
    CAPS: ["OIL / GREASE", "STAIN / DIRT", "HOLES", "MISSING UNSEWN LABEL", "OPEN SEAM", "PUCKERING SEAM", "FABRIC DEFECT", "LONG THREAD", "INCORRECT MEASUREMENTS", "MISSING STITCH", "RAID EDGE", "NEEDLE HOLES", "TAB", "PLEAT", "DROPPED STITCH", "BROKEN STITCH", "SKIPPED STITCH", "SHADE BETWEEN PARTS", "INCORRECT CAP COLOR", "BROKEN VISOR", "UNSEWED / MISSING EYELET", "DEFECTIVE PLASTIC SNAP BACK", "DEFECTIVE STRAP BUCKLE", "DEFECTIVE STRAP VELCRO", "INCORRECT WASH EFFECT", "WASH UNSIGHTLY STREAKS", "DISALIGNED VISOR", "STICKER RESIDUE", "DAMAGED CAUSED BY HANGTAG", "IMPROPER ROPE TENSION", "SWEATBAND SHOWING", "SHOWING MESH BELOW CROWN EDGE"],
    GARMENTS: ["HOLES", "CUTS", "OPEN SEAM", "BAD APPEARANCE", "BROKEN STITCHES", "DIRTY", "DROPPED STITCHES", "EXCESSIVE FULLNESS", "FABRIC FLAW", "INCORRECT MEASUREMENTS", "INCORRECT PATCH OF STITCHES", "INCORRET COMPONENT", "LOOSE TENSION STITCHES", "MISPLACED COMPONENT", "MISSING COMPONENT", "MISSING OPERATION", "NEEDLE HOLES", "OIL / GREASE", "PILLING", "PLEAT", "POINTING MARKS", "PRESS MARKS", "PUCKERING SEAM", "SHADDING PARTS", "SHORES", "SKIPPED STITCHES", "SPI OUT OF TOLERANE", "TIGHT TENSION STITCHES", "TWISTED GARMENT", "UNEVEN GATERING", "UNEVEN PARTS", "UNEVEN STITCHES MARGEN", "UNSECURE COMPONENT", "UNTRIMMED THREAD", "VISSIBLE TACK STITCH", "WEAVY SEAM", "WRONG COLOR THREAD", "OTHER"]
};

// TABLA ANSI ASIGNADA
const rangos = [
    {min:2, max:8, muestra:2, acepta:0, rechaza:1},
    {min:9, max:15, muestra:3, acepta:0, rechaza:1},
    {min:16, max:25, muestra:5, acepta:0, rechaza:1},
    {min:26, max:50, muestra:8, acepta:0, rechaza:1},
    {min:51, max:90, muestra:13, acepta:1, rechaza:2},
    {min:91, max:150, muestra:20, acepta:1, rechaza:2},
    {min:151, max:280, muestra:32, acepta:2, rechaza:3},
    {min:281, max:500, muestra:50, acepta:3, rechaza:4},
    {min:501, max:1200, muestra:80, acepta:5, rechaza:6},
    {min:1201, max:3200, muestra:125, acepta:7, rechaza:8},
    {min:3201, max:10000, muestra:200, acepta:10, rechaza:11},
    {min:10001, max:35000, muestra:315, acepta:14, rechaza:15}
];

function crearSelectDefectos(tipoProducto) {
    const lista = DEFECTOS_POR_TIPO[tipoProducto] || DEFECTOS_POR_TIPO.CAPS;
    let options = `<option value="">-- Defect --</option>`;
    lista.forEach(def => { options += `<option value="${def}">${def}</option>`; });
    return options;
}

function manejarCambioDeProducto() {
    const tipo = document.getElementById("product-type").value;
    const vendorSel = document.getElementById("vendor");
    vendorSel.innerHTML = '<option value="">-- Select Vendor --</option>';
    PROVEEDORES[tipo].forEach(v => {
        let opt = document.createElement('option'); opt.value = v; opt.textContent = v; vendorSel.appendChild(opt);
    });
    document.querySelectorAll('select.codigo-defecto').forEach(s => { s.innerHTML = crearSelectDefectos(tipo); });
}

function calcularFila(fila) {
    let total = parseInt(fila.querySelector('[name="total[]"]').value) || 0;
    let defectosTot = 0;
    fila.querySelectorAll('.cantidad-defecto').forEach(i => { defectosTot += parseInt(i.value) || 0; });

    const inputMuestra = fila.querySelector('[name="muestra[]"]');
    const inputAR = fila.querySelector('[name="ar[]"]');
    const inputAQL = fila.querySelector('[name="aql[]"]');
    const inputTotalDef = fila.querySelector('[name="totalDefectos[]"]');

    const rango = rangos.find(r => total >= r.min && total <= r.max);
    if (rango) {
        inputMuestra.value = rango.muestra;
        inputTotalDef.value = defectosTot;
        inputAQL.value = ((defectosTot / rango.muestra) * 100).toFixed(2) + "%";
        
        // El formato SIEMPRE muestra (Acepta/Rechaza) del estándar, sin importar cuántos defectos se encuentren
        const baseTexto = `(${rango.acepta}/${rango.rechaza})`;
        
        if (defectosTot <= rango.acepta) {
            inputAR.value = `APPROVED ${baseTexto}`;
            inputAR.className = "ar-acepta";
        } else {
            inputAR.value = `REJECTED ${baseTexto}`;
            inputAR.className = "ar-rechaza";
        }
    } else {
        inputMuestra.value = ""; inputAR.value = ""; inputAQL.value = ""; inputTotalDef.value = ""; inputAR.className = "";
    }
}

function agregarFila() {
    const tabla = document.querySelector("#tabla tbody");
    const fila = document.createElement("tr");
    const tipo = document.getElementById("product-type").value;
    fila.innerHTML = `
        <td><input type="text" name="factura[]"></td>
        <td><input type="text" name="po[]"></td>
        <td><input type="text" name="estilo[]"></td>
        <td><input type="text" name="color[]"></td>
        <td><input type="number" name="total[]" min="0" oninput="calcularFila(this.closest('tr'))"></td>
        <td><input type="text" name="muestra[]" readonly></td>
        <td>
            <div class="defectos">
                <div class="defect-row">
                    <select class="codigo-defecto">${crearSelectDefectos(tipo)}</select>
                    <input type="number" placeholder="Qty." class="cantidad-defecto" min="0" oninput="calcularFila(this.closest('tr'))">
                    <button type="button" class="btn small-btn" onclick="quitarDefecto(this)">−</button>
                </div>
            </div>
            <button type="button" class="btn small-btn" onclick="agregarDefecto(this)">➕ Defect</button>
        </td>
        <td><input type="text" name="totalDefectos[]" readonly></td>
        <td><input type="text" name="aql[]" readonly></td>
        <td><input type="text" name="ar[]" readonly></td>
        <td><textarea name="comentarios[]"></textarea></td>`;
    tabla.appendChild(fila);
}

function agregarDefecto(btn) {
    const cell = btn.parentNode.querySelector('.defectos');
    const div = document.createElement('div');
    div.className = 'defect-row';
    div.innerHTML = `<select class="codigo-defecto">${crearSelectDefectos(document.getElementById("product-type").value)}</select>
        <input type="number" placeholder="Qty." class="cantidad-defecto" min="0" oninput="calcularFila(this.closest('tr'))">
        <button type="button" class="btn small-btn" onclick="quitarDefecto(this)">−</button>`;
    cell.appendChild(div);
}

function quitarDefecto(btn) {
    const tr = btn.closest('tr');
    btn.closest('.defect-row').remove();
    calcularFila(tr);
}

function obtenerFechaHoy() {
    const d = new Date();
    return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth()+1).padStart(2, '0')}-${d.getFullYear()}`;
}

function recolectarDatos() {
    const vendor = document.getElementById("vendor").value || "NoVendor";
    const auditor = document.getElementById("auditor").value || "NoSpec";
    const fecha = obtenerFechaHoy();
    const filas = document.querySelectorAll("#tabla tbody tr");
    const datos = [];
    let primeraFactura = "";

    filas.forEach(tr => {
        const celdas = tr.querySelectorAll("td");
        const factura = (celdas[0].querySelector('input')?.value || "").trim();
        if (!primeraFactura && factura) primeraFactura = factura;

        const defs = [];
        tr.querySelectorAll('.defect-row').forEach(row => {
            const cod = row.querySelector('.codigo-defecto').value;
            const qty = row.querySelector('.cantidad-defecto').value;
            if (cod && qty > 0) defs.push({ cod, qty });
        });

        const rowBase = {
            "Audit Date": fecha, "Auditor": auditor, "Vendor": vendor, "Invoice": factura,
            "PO": celdas[1].querySelector('input').value, "Style": celdas[2].querySelector('input').value,
            "Color": celdas[3].querySelector('input').value, "Total Qty": celdas[4].querySelector('input').value,
            "Sample": celdas[5].querySelector('input').value, "Total Def": celdas[7].querySelector('input').value,
            "AQL %": celdas[8].querySelector('input').value, "A/R": celdas[9].querySelector('input').value,
            "Comments": celdas[10].querySelector('textarea').value
        };

        if (defs.length > 0) {
            defs.forEach((d, i) => {
                datos.push({ ...(i === 0 ? rowBase : {}), "Defect Code": d.cod, "Qty": d.qty });
            });
        } else {
            datos.push({ ...rowBase, "Defect Code": "", "Qty": "" });
        }
    });
    return { datos, primeraFactura, vendor, auditor };
}

function descargarSoloExcel() {
    const { datos, vendor, primeraFactura } = recolectarDatos();
    const ws = XLSX.utils.json_to_sheet(datos);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Audit");
    XLSX.writeFile(wb, `${primeraFactura || vendor}_${obtenerFechaHoy()}.xlsx`);
}

function descargarPDF() {
    const { datos, vendor, primeraFactura, auditor } = recolectarDatos();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('l', 'mm', 'a4');
    
    doc.setFontSize(18); doc.text("Blanks Audit Report", 14, 15);
    doc.setFontSize(10); 
    doc.text(`Auditor: ${auditor} | Vendor: ${vendor} | Date: ${obtenerFechaHoy()}`, 14, 22);

    const cols = ["Invoice", "PO", "Style", "Color", "Total", "Sample", "Defect Code", "Qty", "Tot Def", "AQL%", "A/R"];
    const rows = datos.map(d => [d.Invoice||"", d.PO||"", d.Style||"", d.Color||"", d["Total Qty"]||"", d.Sample||"", d["Defect Code"]||"", d.Qty||"", d["Total Def"]||"", d["AQL %"]||"", d["A/R"]||""]);

    doc.autoTable({
        startY: 28, head: [cols], body: rows, theme: 'grid',
        headStyles: { fillColor: '#003366', fontSize: 8 }, styles: { fontSize: 7, halign: 'center' },
        didParseCell: function(data) {
            if (data.column.index === 10 && data.cell.section === 'body') {
                if (data.cell.raw?.includes("REJECTED")) data.cell.styles.textColor = [200, 0, 0];
                if (data.cell.raw?.includes("APPROVED")) data.cell.styles.textColor = [0, 120, 0];
            }
        }
    });
    doc.save(`${primeraFactura || vendor}_${obtenerFechaHoy()}.pdf`);
}

document.getElementById("descargarSoloExcel").addEventListener("click", descargarSoloExcel);
document.getElementById("descargarPDF").addEventListener("click", descargarPDF);
window.onload = () => { manejarCambioDeProducto(); };
</script>

</body>
</html>
