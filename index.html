<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Professional Blanks Audit Report - Kay & Emms Special</title>

    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --primary-color: #003366;
            --secondary-color: #0066cc;
            --background-color: #f4f7f6;
            --card-background: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: var(--background-color); color: var(--text-color); line-height: 1.6; }
        .container { max-width: 100%; margin: 0 auto; }
        .card { background-color: var(--card-background); border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        h1 { text-align: center; color: var(--primary-color); margin: 0 0 25px 0; font-size: 2.5em; font-weight: 600; }
        .controles { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; align-items: flex-end; }
        .control-group { display: flex; flex-direction: column; flex: 1 1 200px; max-width: 300px; }
        .control-group label { font-weight: 600; margin-bottom: 8px; color: var(--primary-color); font-size: 0.95em; }
        select, input[type="text"], input[type="number"], textarea { padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 1em; color: var(--text-color); background-color: #fff; box-sizing: border-box; }
        .actions { display: flex; gap: 12px; margin-left: auto; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; color: white; display: inline-flex; align-items: center; gap: 8px; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-add { background-color: var(--success-color); }
        .btn-excel { background-color: #1f7244; }
        .btn-pdf { background-color: var(--danger-color); }
        .btn-save { background-color: #6f42c1; }
        .btn-small { padding: 5px 10px; font-size: 0.85em; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; }
        th { background-color: var(--primary-color); color: white; padding: 15px 10px; font-size: 0.85em; text-transform: uppercase; }
        td { border-bottom: 1px solid var(--border-color); padding: 10px; text-align: center; background-color: #fff; }
        .defectos-cont { background-color: #f9f9f9; border-radius: 8px; padding: 10px; border: 1px dashed #ccc; margin-bottom: 8px; }
        .defect-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; background-color: #fff; padding: 5px; border-radius: 6px; border: 1px solid #eee; }
        .ar-acepta { background-color: #d4edda !important; color: #155724 !important; font-weight: 700; }
        .ar-rechaza { background-color: #f8d7da !important; color: #721c24 !important; font-weight: 700; }
        .footer { text-align: center; margin-top: 30px; color: #888; font-size: 0.85em; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Blanks Audit Report</h1>
        <div class="controles">
            <div class="control-group">
                <label>👷 Auditor:</label>
                <select id="auditor">
                    <option value="">-- Select Auditor --</option>
                    <option value="Guillermo Ortega">Guillermo Ortega</option>
                    <option value="Griselda Garcia">Griselda Garcia</option>
                    <option value="Jacquelinne Zepeda">Jacquelinne Zepeda</option>
                    <option value="Mackinzie Keller">Mackinzie Keller</option>
                    <option value="Jacy Crouse">Jacy Crouse</option>
                    <option value="Sonia Contreras">Sonia Contreras</option>
                </select>
            </div>

            <div class="control-group">
                <label>📦 Product Type:</label>
                <select id="product-type" onchange="manejarCambioDeProducto()">
                    <option value="HEADWEAR">🧢 HEADWEAR</option>
                    <option value="APPAREL">👕 APPAREL</option>
                </select>
            </div>

            <div class="control-group">
                <label>🏢 Vendor:</label>
                <select id="vendor" onchange="actualizarTablaAQL()">
                    <option value="">-- Select Vendor --</option>
                </select>
            </div>

            <div class="actions">
                <button class="btn btn-add" onclick="agregarFila()">➕ Add Item</button>
                <button class="btn btn-save" onclick="guardarAuditoria(this)">💾 Save Audit</button>
                <button class="btn btn-excel" onclick="descargarExcel()">⬇️ Excel</button>
                <button class="btn btn-pdf" onclick="descargarPDF()">📄 PDF</button>
            </div>
        </div>
    </div>

    <div class="card table-responsive">
        <table id="tabla">
            <thead>
                <tr>
                    <th>Invoice</th><th>PO</th><th>Style</th><th>Color</th>
                    <th>Tot Qty</th><th>Spl</th><th>Defect / Category / Qty</th>
                    <th>Maj</th><th>Min</th><th>AQL%</th><th>Result</th><th>Comments</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <div class="footer">Quality Assurance Department • Internal Audit Tool</div>
</div>
