function manejarCambioDeProducto() {
    const tipo = document.getElementById("product-type").value;
    const vendorSel = document.getElementById("vendor");

    vendorSel.innerHTML = '<option value="">-- Select Vendor --</option>';

    PROVEEDORES[tipo].forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        vendorSel.appendChild(opt);
    });

    document.querySelector("#tabla tbody").innerHTML = "";
    agregarFila();
}

function actualizarTablaAQL() {
    document.querySelectorAll("#tabla tbody tr").forEach(tr => {
        calcularFila(tr);
    });
}

function calcularFila(tr) {
    const vendorActual = document.getElementById("vendor").value;

    const tablaAUsar =
        vendorActual === "Kay & Emms Pvt ltd"
            ? RANGOS_KAY_EMMS
            : RANGOS_ESTANDAR;

    const total =
        parseInt(tr.querySelector('[name="total[]"]').value) || 0;

    let major = 0;
    let minor = 0;

    tr.querySelectorAll(".defect-row").forEach(row => {
        const q =
            parseInt(row.querySelector(".cantidad-defecto").value) || 0;

        const categoria = row.querySelector(".sel-cat").value;

        if (categoria === "MAJOR") {
            major += q;
        } else if (categoria === "MINOR") {
            minor += q;
        }
    });

    tr.querySelector('[name="totalMajor[]"]').value = major;
    tr.querySelector('[name="totalMinor[]"]').value = minor;

    const rango = tablaAUsar.find(
        r => total >= r.min && total <= r.max
    );

    const arInput = tr.querySelector('[name="ar[]"]');

    if (rango) {
        tr.querySelector('[name="muestra[]"]').value = rango.muestra;

        tr.querySelector('[name="aql[]"]').value =
            ((major / rango.muestra) * 100).toFixed(1) + "%";

        if (major <= rango.acepta) {
            arInput.value =
                `APPROVED (${rango.acepta}/${rango.rechaza})`;
            arInput.className = "ar-acepta";
        } else {
            arInput.value =
                `REJECTED (${rango.acepta}/${rango.rechaza})`;
            arInput.className = "ar-rechaza";
        }
    } else {
        tr.querySelector('[name="muestra[]"]').value = "";
        tr.querySelector('[name="aql[]"]').value = "";
        arInput.value = "";
        arInput.className = "";
    }
}

let fotosHojasMedicion = [];

function leerImagenReducida(file, maxSide = 1400, quality = 0.78) {
    return new Promise((resolve, reject) => {
        if (!file || !file.type || !file.type.startsWith("image/")) {
            reject(new Error("Selecciona un archivo de imagen válido."));
            return;
        }

        const reader = new FileReader();

        reader.onload = () => {
            const img = new Image();

            img.onload = () => {
                const scale = Math.min(
                    1,
                    maxSide / Math.max(img.width, img.height)
                );

                const canvas = document.createElement("canvas");

                canvas.width = Math.max(
                    1,
                    Math.round(img.width * scale)
                );

                canvas.height = Math.max(
                    1,
                    Math.round(img.height * scale)
                );

                const ctx = canvas.getContext("2d");

                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.drawImage(
                    img,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                resolve({
                    data: canvas.toDataURL("image/jpeg", quality),
                    width: canvas.width,
                    height: canvas.height,
                    name: file.name
                });
            };

            img.onerror = () => {
                reject(new Error("No se pudo leer " + file.name));
            };

            img.src = reader.result;
        };

        reader.onerror = () => {
            reject(new Error("Error leyendo " + file.name));
        };

        reader.readAsDataURL(file);
    });
}

async function cargarFotosDefecto(input) {
    const preview =
        input.parentElement.querySelector(".photo-preview");

    preview.innerHTML = "";
    input._fotos = [];

    const files = Array.from(input.files || []);

    for (const file of files) {
        try {
            const foto = await leerImagenReducida(
                file,
                1000,
                0.72
            );

            input._fotos.push(foto);

            const img = document.createElement("img");
            img.src = foto.data;
            img.alt = "Fotografía del defecto";

            // El nombre del archivo no se muestra en la vista previa.
            img.title = "Fotografía del defecto";

            preview.appendChild(img);
        } catch (e) {
            alert(e.message);
        }
    }
}

async function cargarFotosMedicion(input) {
    fotosHojasMedicion = [];

    const preview =
        document.getElementById("vista-fotos-medicion");

    preview.innerHTML = "";

    const files = Array.from(input.files || []);

    for (const file of files) {
        try {
            const foto = await leerImagenReducida(
                file,
                1600,
                0.78
            );

            fotosHojasMedicion.push(foto);

            const card = document.createElement("div");
            card.className = "photo-card";

            const img = document.createElement("img");
            img.src = foto.data;
            img.alt = "Hoja de medición";

            // No mostrar el nombre original del archivo.
            img.title = "Hoja de medición";

            const caption = document.createElement("div");
            caption.textContent = "Hoja de medición";

            card.appendChild(img);
            card.appendChild(caption);

            preview.appendChild(card);
        } catch (e) {
            alert(e.message);
        }
    }
}

function agregarFotosAlPDF(doc, fotos, titulo, detalle = "") {
    fotos.forEach((foto) => {
        // Cada fotografía ocupa su propia página.
        // No se crea una página adicional de resumen.

        doc.addPage();

        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();

        // Título de la página.
        doc.setFontSize(13);
        doc.setTextColor(0, 51, 102);
        doc.text(titulo, 14, 15);

        let top;

        if (detalle) {
            // Mostrar detalles del defecto, pero nunca el nombre del archivo.
            doc.setFontSize(9);
            doc.setTextColor(60, 60, 60);

            const lineasDetalle = doc.splitTextToSize(
                detalle,
                pageWidth - 28
            );

            doc.text(lineasDetalle, 14, 22);

            top = 22 + (lineasDetalle.length * 4) + 5;
        } else {
            // Sin nombre de archivo ni texto "Foto 1 de 1".
            top = 22;
        }

        const maxW = pageWidth - 28;
        const maxH = pageHeight - top - 14;

        const ratio = Math.min(
            maxW / foto.width,
            maxH / foto.height
        );

        const w = foto.width * ratio;
        const h = foto.height * ratio;

        const x = (pageWidth - w) / 2;

        // Insertar la fotografía sin nombre ni pie de foto.
        doc.addImage(
            foto.data,
            "JPEG",
            x,
            top,
            w,
            h,
            undefined,
            "FAST"
        );
    });
}

function recolectarFotosDefectos() {
    const fotos = [];

    document.querySelectorAll("#tabla tbody tr").forEach(tr => {
        const invoice =
            tr.querySelector('[name="factura[]"]').value || "";

        const po =
            tr.querySelector('[name="po[]"]').value || "";

        const style =
            tr.querySelector('[name="estilo[]"]').value || "";

        const color =
            tr.querySelector('[name="color[]"]').value || "";

        tr.querySelectorAll(".defect-row").forEach(dr => {
            const input = dr.querySelector(".fotos-defecto");

            const defect =
                dr.querySelector(".codigo-defecto").value ||
                "Defecto sin especificar";

            const fotosAdjuntas =
                input && input._fotos ? input._fotos : [];

            fotosAdjuntas.forEach(foto => {
                fotos.push({
                    ...foto,

                    // Estos detalles sí pueden aparecer en el PDF.
                    // No se incluye el nombre del archivo.
                    detalle:
                        `Invoice: ${invoice} | PO: ${po} | ` +
                        `Style: ${style} | Color: ${color} | ` +
                        `Defect: ${defect}`
                });
            });
        });
    });

    return fotos;
}

// ======================================================
// RECOLECTAR DATOS DE AUDITORÍA
// ======================================================

function recolectarDatosParaExportar() {
    const vendor =
        document.getElementById("vendor").value || "N/A";

    const auditor =
        document.getElementById("auditor").value || "N/A";

    const fecha = new Date().toLocaleDateString();

    const data = [];

    document.querySelectorAll("#tabla tbody tr").forEach(tr => {
        const totalQty =
            tr.querySelector('[name="total[]"]').value;

        if (!totalQty || totalQty === "0") {
            return;
        }

        const base = {
            "Date": fecha,
            "Auditor": auditor,
            "Vendor": vendor,
            "Invoice": tr.querySelector('[name="factura[]"]').value || "",
            "PO": tr.querySelector('[name="po[]"]').value || "",
            "Style": tr.querySelector('[name="estilo[]"]').value || "",
            "Color": tr.querySelector('[name="color[]"]').value || "",
            "Total Qty": totalQty,
            "Sample": tr.querySelector('[name="muestra[]"]').value || "0",
            "Tot Major": tr.querySelector('[name="totalMajor[]"]').value || "0",
            "Tot Minor": tr.querySelector('[name="totalMinor[]"]').value || "0",
            "AQL%": tr.querySelector('[name="aql[]"]').value || "0%",
            "Result": tr.querySelector('[name="ar[]"]').value || "APPROVED",
            "Comments": tr.querySelector('[name="comentarios[]"]').value || ""
        };

        const defectRows = tr.querySelectorAll(".defect-row");

        let tieneDefectosValidos = false;
        let primero = true;

        defectRows.forEach(dr => {
            const defName =
                dr.querySelector(".codigo-defecto").value;

            const defQty =
                dr.querySelector(".cantidad-defecto").value;

            if (defName && defQty && parseInt(defQty) > 0) {
                tieneDefectosValidos = true;

                data.push({
                    ...(primero ? base : {
                        "Date": "",
                        "Auditor": "",
                        "Vendor": "",
                        "Invoice": "",
                        "PO": "",
                        "Style": "",
                        "Color": "",
                        "Total Qty": "",
                        "Sample": "",
                        "Tot Major": "",
                        "Tot Minor": "",
                        "AQL%": "",
                        "Result": "",
                        "Comments": ""
                    }),

                    "Defect Description": defName,
                    "Def Cat": dr.querySelector(".sel-cat").value,
                    "Def Qty": defQty
                });

                primero = false;
            }
        });

        if (!tieneDefectosValidos) {
            data.push({
                ...base,
                "Defect Description": "",
                "Def Cat": "",
                "Def Qty": ""
            });
        }
    });

    return data;
}

// ======================================================
// GUARDAR AUDITORÍA EN GOOGLE SHEETS
// ======================================================

async function guardarAuditoria(btn) {
    const auditor = document.getElementById("auditor").value;
    const vendor = document.getElementById("vendor").value;

    if (!auditor) {
        return alert("Select an auditor first.");
    }

    if (!vendor) {
        return alert("Select a vendor first.");
    }

    const datos = recolectarDatosParaExportar();

    if (datos.length === 0) {
        return alert("No data to save.");
    }

    const camposBase = [
        "Auditor",
        "Vendor",
        "Invoice",
        "PO",
        "Style",
        "Color",
        "Total Qty",
        "Sample",
        "Tot Major",
        "Tot Minor",
        "AQL%",
        "Result",
        "Comments"
    ];

    const auditId = "AUD-" + Date.now();
    const timestamp = new Date().toISOString();

    const tipo = document.getElementById("product-type").value;

    const aqlStd =
        vendor === "Kay & Emms Pvt ltd"
            ? "MIL-STD-105E (4.0)"
            : "MIL-STD-105E (2.5)";

    let previa = null;

    const rows = datos.map(d => {
        const fila = { ...d };

        if (
            d["Invoice"] === "" &&
            d["Total Qty"] === "" &&
            previa
        ) {
            camposBase.forEach(c => {
                fila[c] = previa[c];
            });
        } else {
            previa = d;
        }

        return {
            "Audit ID": auditId,
            "Timestamp": timestamp,
            "Product Type": tipo,
            "AQL Standard": aqlStd,
            ...fila
        };
    });

    btn.disabled = true;
    btn.textContent = "Saving...";

    try {
        await fetch(URL_GUARDADO, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({ rows })
        });

        alert(
            `✅ Audit sent (${rows.length} rows). ID: ${auditId}\n` +
            'Verifica la pestaña "Audits" en Google Sheets.'
        );
    } catch (e) {
        alert("❌ Could not save: " + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = "💾 Save Audit";
    }
}

// ======================================================
// EXPORTAR EXCEL
// ======================================================

function descargarExcel() {
    const datos = recolectarDatosParaExportar();

    if (datos.length === 0) {
        return alert("No data to export.");
    }

    const productType =
        document.getElementById("product-type").value;

    const vendorName =
        document.getElementById("vendor").value || "Vendor";

    const ws = XLSX.utils.json_to_sheet(datos);

    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb, ws, "AuditReport");

    XLSX.writeFile(
        wb,
        `${productType}_Audit_Report_${vendorName.replace(/\s+/g, "_")}.xlsx`
    );
}

// ======================================================
// EXPORTAR PDF
// ======================================================

async function descargarPDF() {
    const rawData = recolectarDatosParaExportar();

    if (rawData.length === 0) {
        return alert("No data to export.");
    }

    if (!window.jspdf || !window.jspdf.jsPDF) {
        return alert("No se pudo cargar la librería PDF. Revisa tu conexión.");
    }

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF("l", "mm", "a4");

    const productType =
        document.getElementById("product-type").value;

    const vendorName =
        document.getElementById("vendor").value || "N/A";

    const dateStr = new Date().toLocaleDateString("es-ES");

    const aqlStr =
        vendorName === "Kay & Emms Pvt ltd"
            ? "MIL-STD-105E (4.0)"
            : "MIL-STD-105E (2.5)";

    // Encabezado del reporte.
    doc.setFontSize(18);
    doc.setTextColor(0, 51, 102);

    doc.text(
        `${productType} BLANKS AUDIT REPORT`,
        14,
        15
    );

    doc.setFontSize(11);
    doc.setTextColor(50, 50, 50);

    doc.text(
        `Vendor: ${vendorName} | Date: ${dateStr} | AQL Standard: ${aqlStr}`,
        14,
        22
    );

    doc.setDrawColor(0, 51, 102);
    doc.line(14, 25, 283, 25);

    const tableBody = rawData.map(d => [
        d.Invoice || "",
        d.PO || "",
        d.Style || "",
        d.Color || "",
        d["Total Qty"] || "",
        d.Sample || "",
        d["Defect Description"]
            ? `${d["Defect Description"]} (${d["Def Cat"]}: ${d["Def Qty"]})`
            : "",
        d["Tot Major"] || "",
        d["Tot Minor"] || "",
        d["AQL%"] || "",
        d.Result || ""
    ]);

    doc.autoTable({
        startY: 30,

        head: [[
            "Inv",
            "PO",
            "Style",
            "Color",
            "Tot",
            "Spl",
            "Defect Details",
            "Maj",
            "Min",
            "AQL%",
            "Result"
        ]],

        body: tableBody,

        theme: "grid",

        styles: {
            fontSize: 7.5,
            halign: "center",
            cellPadding: 2
        },

        columnStyles: {
            6: {
                halign: "left",
                cellWidth: 50
            }
        },

        headStyles: {
            fillColor: [0, 51, 102],
            textColor: [255, 255, 255]
        }
    });

    // Fotografías de defectos.
    // Cada imagen tendrá su propia página.
    // NO se muestra "Foto 1 de 1" ni el nombre del archivo.
    const fotosDefectos = recolectarFotosDefectos();

    if (fotosDefectos.length > 0) {
        fotosDefectos.forEach(foto => {
            agregarFotosAlPDF(
                doc,
                [foto],
                "DEFECT PHOTO",
                foto.detalle
            );
        });
    }

    // Fotografías de hojas de medición.
    // Cada imagen tendrá su propia página, sin nombre de archivo.
    if (fotosHojasMedicion.length > 0) {
        fotosHojasMedicion.forEach(foto => {
            agregarFotosAlPDF(
                doc,
                [foto],
                "MEASUREMENT"
            );
        });
    }

    // Descargar el reporte.
    const nombreArchivo =
        `${productType}_Audit_Report_${vendorName.replace(/\s+/g, "_")}.pdf`;

    doc.save(nombreArchivo);
}
